name: Model Training and Docker CI

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # MENGUNCI VERSI LIBRARY AGAR DOCKER TIDAK BINGUNG
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn==1.3.2 pandas==2.1.4 setuptools wheel

      # HARDCODE USERNAME ZAHRAN19 LANGSUNG DI SINI
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: zahran19
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Run MLflow Project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Upload Model Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: live_model/

      # HARDCODE NAMA IMAGE DOCKER
      - name: Build Docker Image using MLflow
        run: |
          mlflow models build-docker -m live_model -n zahran19/credit-scoring-api:latest

      # HARDCODE PUSH KE DOCKER HUB
      - name: Push Docker Image to Docker Hub
        run: |
          docker push zahran19/credit-scoring-api:latest