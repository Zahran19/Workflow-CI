name: Model Training and Docker CI

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn pandas

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Run MLflow Project
        run: |
          mlflow run MLProject --no-conda

      # Memenuhi kriteria SKILLED: Menyimpan artefak model ke repositori GitHub Actions
      - name: Upload Model Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: MLProject/live_model/

      # Memenuhi kriteria ADVANCED: Build Docker Image menggunakan fungsi resmi MLflow
      - name: Build Docker Image using MLflow
        run: |
          mlflow models build-docker -m MLProject/live_model -n ${{ secrets.DOCKER_HUB_USERNAME }}/credit-scoring-api:latest

      # Memenuhi kriteria ADVANCED: Push Docker Image ke Docker Hub
      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/credit-scoring-api:latest